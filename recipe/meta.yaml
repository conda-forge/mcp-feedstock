{% set version = "2.0.0" %}
{% set python_min = "3.10" %}

package:
  name: mcp-split
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/m/mcp-types/mcp_types-{{ version }}.tar.gz
    sha256: d7d939b9285c9961ae8866ba75ef85da34d12bafe276efbf4eb6a131786d8379
    folder: mcp-types
  - url: https://pypi.org/packages/source/m/mcp/mcp-{{ version }}.tar.gz
    sha256: 0f440e735c13ece8bb19bc62cf0b86f4313448432fbb77d35e14034f4e050728
    folder: mcp

build:
  number: 0

outputs:
  - name: mcp-types
    build:
      noarch: python
      script: UV_DYNAMIC_VERSIONING_BYPASS=${PKG_VERSION} ${PYTHON} -m pip install ./mcp-types -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python {{ python_min }}
        - hatchling
        - uv-dynamic-versioning 0.14.0
        - pip
      run:
        - python >={{ python_min }}
        - pydantic >=2.12.0,<3.0.0
        - typing-extensions >=4.13.0
    test:
      imports:
        - mcp_types
      commands:
        - pip check
      requires:
        - pip
        - python {{ python_min }}
    about:
      summary: Model Context Protocol wire types
      home: https://github.com/modelcontextprotocol/python-sdk
      license: MIT
      license_file: mcp-types/LICENSE

  - name: mcp
    build:
      noarch: python
      entry_points:
        - mcp = mcp.cli:app
      script: UV_DYNAMIC_VERSIONING_BYPASS=${PKG_VERSION} ${PYTHON} -m pip install ./mcp -vv --no-deps --no-build-isolation
    requirements:
      host:
        - python {{ python_min }}
        - hatchling
        - uv-dynamic-versioning 0.14.0
        - pip
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage("mcp-types", min_pin="x.x.x", max_pin="x.x.x") }}
        - anyio >=4.5
        - cryptography >=3.4.0
        - httpx2 >=2.5.0
        - jsonschema >=4.20.0
        - opentelemetry-api >=1.28.0
        - pydantic >=2.12.0,<3.0.0
        - pydantic-settings >=2.5.2
        - pyjwt >=2.10.1
        - python-dotenv >=1.0.0
        - python-multipart >=0.0.9
        - pywin32-on-windows
        - rich >=13.9.4
        - sse-starlette >=3.0.0
        - starlette >=0.48
        - typer >=0.16.0
        - typing-extensions >=4.13.0
        - typing-inspection >=0.4.1
        - uvicorn >=0.31.1
      run_constrained:
        - pywin32 >=311
    test:
      imports:
        - mcp
        - mcp.os.win32.utilities
      commands:
        - pip check
        - mcp --help
      requires:
        - pip
        - python {{ python_min }}
    about:
      summary: Model Context Protocol SDK
      home: https://github.com/modelcontextprotocol/python-sdk
      license: MIT
      license_file: mcp/LICENSE

about:
  summary: Model Context Protocol SDK and wire types
  home: https://github.com/modelcontextprotocol/python-sdk
  license: MIT
  license_file: mcp/LICENSE

extra:
  recipe-maintainers:
    - dbast
